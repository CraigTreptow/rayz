stages:
  - validate
  - lint
  - test

pipeline-check:
  stage: validate
  image: alpine:latest
  script:
    - echo "Pipeline OK for $CI_COMMIT_BRANCH"

# ── Ruby ──────────────────────────────────────────────────────────────────────

.ruby-base:
  image: ruby:4.0.2
  variables:
    BUNDLE_PATH: vendor/bundle
  cache:
    key: ruby-gems-$CI_COMMIT_REF_SLUG
    paths:
      - ruby/vendor/bundle
  before_script:
    - cd ruby
    - bundle install --quiet

lint-ruby:
  extends: .ruby-base
  stage: lint
  script:
    - bundle exec standardrb
  rules:
    - changes:
        paths:
          - ruby/**/*
        compare_to: master

test-ruby:
  extends: .ruby-base
  stage: test
  script:
    - bundle exec cucumber
  rules:
    - changes:
        paths:
          - ruby/**/*
        compare_to: master

# ── Python ────────────────────────────────────────────────────────────────────

.python-base:
  image: python:3.13-slim
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_PYTHON: "3.14"
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths:
      - python/.uv-cache
  before_script:
    - pip install uv --quiet
    - cd python
    - uv python install 3.14
    - uv sync --quiet

lint-python:
  extends: .python-base
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
  rules:
    - changes:
        paths:
          - python/**/*
        compare_to: master

test-python:
  extends: .python-base
  stage: test
  script:
    - uv run behave features/
  rules:
    - changes:
        paths:
          - python/**/*
        compare_to: master

# ── Shell ─────────────────────────────────────────────────────────────────────

lint-shell:
  stage: lint
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq && apt-get install -y shellcheck
  script:
    - find . -name '*.sh' -print0 | xargs -0 shellcheck
  rules:
    - changes:
        paths:
          - "**/*.sh"
        compare_to: master
