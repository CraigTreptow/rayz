stages:
  - validate
  - lint
  - test

pipeline-check:
  stage: validate
  image: alpine:latest
  script:
    - echo "Pipeline OK for $CI_COMMIT_BRANCH"

# ── Ruby ──────────────────────────────────────────────────────────────────────

.ruby-base:
  image: ruby:4.0.2
  variables:
    BUNDLE_PATH: vendor/bundle
  cache:
    key: ruby-gems-$CI_COMMIT_REF_SLUG
    paths:
      - ruby/vendor/bundle
  before_script:
    - cd ruby
    - bundle install --quiet

lint-ruby:
  extends: .ruby-base
  stage: lint
  script:
    - bundle exec standardrb
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        paths:
          - ruby/**/*
        compare_to: master

test-ruby:
  extends: .ruby-base
  stage: test
  script:
    - bundle exec cucumber
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        paths:
          - ruby/**/*
        compare_to: master

# ── JRuby ─────────────────────────────────────────────────────────────────────

.jruby-base:
  image: jruby:10.1-jdk25
  variables:
    BUNDLE_PATH: vendor/bundle
  cache:
    key: jruby-gems-$CI_COMMIT_REF_SLUG
    paths:
      - jruby/vendor/bundle
  before_script:
    # minitest pulls in prism, which needs a C compiler to build its
    # native extension; the base jruby image doesn't ship one.
    - apt-get update -qq && apt-get install -y --no-install-recommends build-essential > /dev/null
    - cd jruby
    - bundle install --quiet

lint-jruby:
  extends: .jruby-base
  stage: lint
  script:
    - bundle exec standardrb
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        paths:
          - jruby/**/*
        compare_to: master

test-jruby:
  extends: .jruby-base
  stage: test
  script:
    - bundle exec cucumber
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        paths:
          - jruby/**/*
        compare_to: master

# ── Python ────────────────────────────────────────────────────────────────────

.python-base:
  image: python:3.13-slim
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_PYTHON: "3.14"
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths:
      - python/.uv-cache
  before_script:
    - pip install uv --quiet
    - cd python
    - uv python install 3.14
    - uv sync --quiet

lint-python:
  extends: .python-base
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        paths:
          - python/**/*
        compare_to: master

test-python:
  extends: .python-base
  stage: test
  script:
    - uv run behave features/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        paths:
          - python/**/*
        compare_to: master

# ── Crystal ───────────────────────────────────────────────────────────────────

.crystal-base:
  image: crystallang/crystal:1.20.2
  variables:
    CRYSTAL_CACHE_DIR: $CI_PROJECT_DIR/crystal/.crystal-cache
  cache:
    key: crystal-cache-$CI_COMMIT_REF_SLUG
    paths:
      - crystal/.crystal-cache
  before_script:
    - cd crystal

lint-crystal:
  extends: .crystal-base
  stage: lint
  script:
    - crystal tool format --check
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        paths:
          - crystal/**/*
        compare_to: master

test-crystal:
  extends: .crystal-base
  stage: test
  script:
    - crystal spec
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        paths:
          - crystal/**/*
        compare_to: master

# ── Rust ──────────────────────────────────────────────────────────────────────

.rust-base:
  image: rust:1.96
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/rust/.cargo-home
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths:
      - rust/.cargo-home
      - rust/target
  before_script:
    - rustup component add rustfmt clippy
    - cd rust

lint-rust:
  extends: .rust-base
  stage: lint
  script:
    - cargo fmt -- --check
    - cargo clippy -- -D warnings
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        paths:
          - rust/**/*
        compare_to: master

test-rust:
  extends: .rust-base
  stage: test
  script:
    - cargo test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        paths:
          - rust/**/*
        compare_to: master

# ── Shell ─────────────────────────────────────────────────────────────────────

lint-shell:
  stage: lint
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq && apt-get install -y shellcheck
  script:
    - find . -name '*.sh' -print0 | xargs -0 shellcheck
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        paths:
          - "**/*.sh"
        compare_to: master
