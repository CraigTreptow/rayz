# name|description|env_vars
#
# JRuby benchmark — no YJIT (JVM handles JIT), no Ractor (JVM threads instead).
# JRuby has real OS threads with no GIL, so Thread parallelism gives genuine
# CPU-level speedup unlike MRI Ruby.
#
parallel|JRuby Thread parallelism (real OS threads, no GIL)|PARALLEL=true
sequential|JRuby single-threaded|PARALLEL=false
